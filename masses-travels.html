      const typeColor = {

        tutorial: "bg-emerald-500",

        special: "bg-amber-500",

              { id: "operation", label: "常规作战" },
              { id: "ex", label: "高难 EX" },
              { id: "story", label: "故事" },

                key={f.id}
                onClick={() => setFilter(f.id)}
                className={`px-4 py-1.5 rounded-full text-sm transition-all ${

                    ? "bg-cyan-500 text-slate-900 font-medium"
                    : "bg-slate-800 text-slate-300 hover:bg-slate-700"

          <main className="max-w-7xl mx-auto px-6 py-12">

            {activeTab === "workshop" && <Workshop />}
            {activeTab === "medals" && <Medals />}
            {activeTab === "shop" && <Shop />}
          </main>

          <footer className="border-t border-slate-800 py-8 text-center text-slate-500 text-sm">
            <p>基于明日方舟活动「众生行记」资料整理 · 仅供展示交流</p>
            <p className="mt-1 text-xs">The Masses' Travels · Arknights</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
